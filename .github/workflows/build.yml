name: Auto Release on Every Commit

on:
  push:
    branches:
      - main

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Create zip archive of the repo
        run: |
          zip -r release.zip . -x ".git/*" ".github/*"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v1
        with:
          name: "Release ${{ steps.vars.outputs.sha_short }}"
          tag_name: "commit-${{ steps.vars.outputs.sha_short }}"
          body: "Automated release for commit ${{ steps.vars.outputs.sha_short }}"
          files: release.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
